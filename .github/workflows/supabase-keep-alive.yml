name: Keep Supabase projects alive

# Pings every project's REST API with one lightweight, real SELECT query so
# none of them cross Supabase's 7-day inactivity threshold. Runs every 3
# days for a comfortable safety margin. Costs nothing: this step takes a
# few seconds and GitHub Actions' free tier gives 2,000 min/month on
# private repos (unlimited on public repos).

on:
  schedule:
    - cron: '0 6 */3 * *'   # every 3 days at 06:00 UTC
  workflow_dispatch:         # lets you trigger it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping each Supabase project
        run: |
          set -e

          # ---------------------------------------------------------------
          # Add one line per site: "Name|SupabaseURL|AnonKey|TableToQuery"
          # The anon key is safe to keep here in plain text - it's the same
          # public key already shipped in each site's own index.html,
          # protected by RLS, not a secret credential.
          # ---------------------------------------------------------------
          SITES='
          BuyAndSellCar|https://tpkayzzhqetqdqeaneol.supabase.co|sb_publishable_eoAhg6S6dA2zJg_l_tjkVA_6nxsPDKV|profiles
          BuyAndSellVan|https://fsrkmtdauphebmjbxjoc.supabase.co|sb_publishable_f1Ma40H0dHsRb7qrg84uDA_sSGVAS5d|profiles
          BuyAndSellBike|https://pkufduorydtnirzmvbqe.supabase.co|sb_publishable_GIu3684qV5_wrVtE9bbp-g_3aAF2TII|profiles
          BuyAndSellPhone|https://juaugnyuehijpstwzoro.supabase.co|sb_publishable_spVdnUPkoT0-j7qA64Wtqg_WalSYtAQ|profiles
          BuyAndSellClothes|https://ddvactrvjeyqzyjgaohc.supabase.co|sb_publishable_XjIn0k9k2Fm4sf4iLmg8aQ_iIXHOXaN|profiles
          BuyAndSellHome|https://anlbttnezrceomszghia.supabase.co|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFubGJ0dG5lenJjZW9tc3pnaGlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzYwNjAsImV4cCI6MjA5NTExMjA2MH0.VvteFmm1CTY4QnBOaCwOq4GyY_0h67PASXX4inFUC74|profiles
          VegePlanet|https://gkogfhvkrnxxbjcjlmcw.supabase.co|sb_publishable_x3FGsRu5wiCHrFWuGp69mw_WbOto8Jr|profiles
          OKMAM|https://jbjqfkrftgmvftyadfbl.supabase.co|sb_publishable_84XxzpHp2iOzrtIMgMhy5w_CWJdJu2O|profiles
          TrustedPeople|https://zxvumeacyllrtacwlhnb.supabase.co|sb_publishable_8lNzrlmY4JOSuXmbOu7oGQ|profiles
          TrustedBuilder|https://jtmjubxmuwxfktetjltu.supabase.co|sb_publishable_GuhGjOqVz2TyUUhexDtUfQ_y4G2hKKh|profiles
          LocalMenu|https://jfoxmauduqxflshznqvo.supabase.co|sb_publishable_v0Xv_2KelLAAyW482fQ9hg_kx7ZoFpG|profiles
          AirportDeals|https://szhwkgjddmtaxzaagoxj.supabase.co|sb_publishable_M_t8h3j7ifVdGl09RjqVZw_8Mut0pay|profiles
          '

          FAILED=0
          echo "$SITES" | while IFS='|' read -r NAME URL KEY TABLE; do
            [ -z "$NAME" ] && continue
            echo "Pinging $NAME..."
            STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              "${URL}/rest/v1/${TABLE}?select=id&limit=1" \
              -H "apikey: ${KEY}" \
              -H "Authorization: Bearer ${KEY}")
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "  OK: $NAME ($STATUS)"
            else
              echo "  FAILED: $NAME ($STATUS) - response:"
              cat /tmp/resp.json
              FAILED=1
            fi
          done

          exit $FAILED
